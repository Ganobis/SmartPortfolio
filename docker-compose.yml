services:
    api:
        image: smartportfolio-api
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "5000:8080"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ConnectionStrings__DefaultConnection=Server=db;Database=SmartPortfolioDb;User Id=sa;Password=Password123!;TrustServerCertificate=True;
        depends_on:
            - db
            
    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
            - ACCEPT_EULA=Y
            - SA_PASSWORD=Password123!
        ports:
            - "1433:1433"